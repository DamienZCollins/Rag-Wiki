# RAG-Wiki 统一配置模板
# 本文件入库，只写 ${VAR:default}，默认值仅是与 docker-compose.yml 对齐的本地开发值
# 真实密钥走环境变量（.env 由启动脚本加载）或 config/application-local.yml（不入库）

spring:
  application:
    name: rag-wiki
  threads:
    virtual:
      enabled: true
  datasource:
    # characterEncoding 要写 Java 字符集名 UTF-8，不是 MySQL 字符集名 utf8mb4；
    # Connector/J 8 起在 MySQL 8 上会自动协商到服务端的 utf8mb4
    # connectionTimeZone 用 IANA 时区名（不写 +08:00，避免 URL 里 + 号转义问题），
    # 未加 forceConnectionTimeZoneToSession 时只影响驱动侧换算，不下发 SET time_zone
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:rag_wiki}?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:rag_wiki}
    password: ${MYSQL_PASSWORD:rag_wiki}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: rag-wiki-pool
      maximum-pool-size: ${MYSQL_POOL_MAX:20}
      minimum-idle: ${MYSQL_POOL_MIN:5}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: 0
      timeout: 3s
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ragwiki.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 建表用 BIGINT AUTO_INCREMENT，主键交给数据库自增
      id-type: auto
      table-underline: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ---------- 模型接入：三组独立配置，可分别换模型、分别限额、分别排查 ----------
# 密钥默认为空，不填则对应能力不可用；中间件与语料相关验证不受影响
model:
  chat:
    base-url: ${CHAT_BASE_URL:}
    api-key: ${CHAT_API_KEY:}
    model: ${CHAT_MODEL:}
    temperature: ${CHAT_TEMPERATURE:0.2}
    max-tokens: ${CHAT_MAX_TOKENS:2048}
    timeout: ${CHAT_TIMEOUT:60s}
  embedding:
    # dimensions 必须与 ES 索引 dense_vector 的 dims 一致，改动即需重建索引
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    batch-size: ${EMBEDDING_BATCH_SIZE:32}
    timeout: ${EMBEDDING_TIMEOUT:60s}
  compile:
    base-url: ${COMPILE_BASE_URL:}
    api-key: ${COMPILE_API_KEY:}
    model: ${COMPILE_MODEL:}
    temperature: ${COMPILE_TEMPERATURE:0.1}
    max-tokens: ${COMPILE_MAX_TOKENS:16384}
    timeout: ${COMPILE_TIMEOUT:180s}

# ---------- Agent 内核 ----------
agent:
  # 内层循环单轮的模型调用步数上限，防止工具调用不收敛
  max-steps: ${AGENT_MAX_STEPS:6}
  sse-timeout: ${AGENT_SSE_TIMEOUT:180s}
  # 恢复会话上下文时最多带多少条历史消息
  max-history-messages: ${AGENT_HISTORY_MAX_MESSAGES:40}

# ---------- 检索 ----------
rag:
  index:
    # 所有查询走别名，物理索引靠改别名指向切换，不改代码
    alias: ${ES_INDEX_ALIAS:knowledge_chunks}
    # doc 读 corpus/policies，wiki 读 wiki/pages；物理索引名 = knowledge_{source}_{version}
    source: ${RAG_INDEX_SOURCE:wiki}
    # mapping 变更时递增，旧索引保留作对照
    version: ${RAG_INDEX_VERSION:v1}
    analyzer: ${RAG_ANALYZER:cjk}
  chunk:
    max-chars: ${RAG_CHUNK_MAX_CHARS:600}
    overlap-chars: ${RAG_CHUNK_OVERLAP_CHARS:80}
  rrf:
    k: ${RAG_RRF_K:60}
  candidate-window: ${RAG_CANDIDATE_WINDOW:50}
  top-k: ${RAG_TOP_K:8}
  # 拒答按单路原始分判定：两路最高分都低于各自阈值才拒答
  refuse:
    bm25-threshold: ${RAG_REFUSE_BM25_THRESHOLD:8.0}
    vector-threshold: ${RAG_REFUSE_VECTOR_THRESHOLD:0.72}

# ---------- 快通道 ----------
fastpath:
  scene: ${FASTPATH_SCENE:aftersale}
  cache-ttl: ${FASTPATH_CACHE_TTL:300s}
  # 命中阈值：低于它的条目不判为命中
  min-confidence: ${FASTPATH_MIN_CONFIDENCE:0.8}
  # 派生条目来自已生效的 Wiki 条目，置信度高；沉淀条目没来源，低于阈值，必须人工绑定来源才有意义
  derived-confidence: ${FASTPATH_DERIVED_CONFIDENCE:0.9}
  distilled-confidence: ${FASTPATH_DISTILLED_CONFIDENCE:0.6}
  distill:
    min-hits: ${FASTPATH_DISTILL_MIN_HITS:3}
    window-days: ${FASTPATH_DISTILL_WINDOW_DAYS:7}

# ---------- Wiki 编译 ----------
wiki:
  page-dir: ${WIKI_PAGE_DIR:wiki/pages}
  # 矛盾检测先用向量相似度筛候选条目对，再让模型判定，把调用压到一次
  lint-similarity-threshold: ${WIKI_LINT_SIMILARITY_THRESHOLD:0.7}
  lint-max-pairs: ${WIKI_LINT_MAX_PAIRS:20}

# ---------- 语料与产物路径 ----------
ragwiki:
  corpus:
    policy-dir: ${CORPUS_POLICY_DIR:corpus/policies}
    ticket-dir: ${CORPUS_TICKET_DIR:corpus/tickets}
  wiki:
    page-dir: ${WIKI_PAGE_DIR:wiki/pages}
